services:
  create-more-dt:
    build: .
    image: create-more-dt:latest
    container_name: create-more-dt
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      STORAGE_DIR: /app/storage
    ports:
      # HOST_BIND=127.0.0.1 -> hanya dari VPS sendiri (lewat Nginx)
      # HOST_BIND=0.0.0.0   -> bisa diakses langsung via http://IP-VPS:HOST_PORT
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    volumes:
      - dt_storage:/app/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dt_storage:
